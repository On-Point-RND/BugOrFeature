hardware:
  device: 0
  compile: false
  coordinate_descent_tuning: true
  amp: false

model:
  layer_swap_simple:
    enabled: true
    copy_weights: true
    include_leaf_names: []   
    exclude_substrings: ["lm_head"]                      
    default_custom_layer_config:
      alpha: 0.05

    per_layer_config:
      lm_head:
        alpha: 0.2

  size: "d4"  # Options: d4, d12, d24, d36, d48
  
  vocab_size: 50257
  n_layer: 4
  n_head: 4
  n_embed: 768

  # MODEL_CONFIGS = {
  #   "d4":  GPTConfig(vocab_size=cfg['model']['vocab_size'], n_layer=4, n_head=4, n_embd=256), # Debug
  #   "d12": GPTConfig(vocab_size=cfg['model']['vocab_size'], n_layer=12, n_head=12, n_embd=768),
  #   "d24": GPTConfig(vocab_size=cfg['model']['vocab_size'], n_layer=24, n_head=16, n_embd=1024),
  #   "d36": GPTConfig(vocab_size=cfg['model']['vocab_size'], n_layer=36, n_head=20, n_embd=1280),
  #   "d48": GPTConfig(vocab_size=cfg['model']['vocab_size'], n_layer=48, n_head=25, n_embd=1600),


training:
  batch_size: 64
  sequence_length: 128
  num_iterations: 5000000 
  learning_rate: 0.0001
  warmup_iters: 1000
  warmdown_iters: 0
  weight_decay: 0.0001
  grad_accumulation_steps: 9
  optimizer_betas: [0.9, 0.95] # Added optimizer betas
 
 

evaluation:
  val_tokens: 1048576  # Fixed value as per original code
  val_loss_every: 5
  val_batch_size: 16

logging:
  output_dir: "./hdd"
  save_every: 50000
  use_ml_flow: false #
  mlflow_tracking_uri: http://195.209.214.105:5000
  experiment_name: debug

data:
  input_bin: "data/fineweb10B/fineweb_train_000001.bin"
  input_val_bin: "data/fineweb10B/fineweb_train_000050.bin"
